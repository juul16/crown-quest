<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market — Crown Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>🏪 Crown Quest Market</h1>
    <div>👑 <span data-coins>500</span></div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="levels.html">Levels</a>
    <a href="shop.html">Shop</a>
    <a href="collection.html">Collection</a>
    <a href="battlepass.html">Battle Pass</a>
    <a href="market.html">Market</a>
  </nav>

  <main class="container">
    <section>
      <h2>Create a Listing</h2>
      <p>List an item for other players to browse.</p>

      <form id="listingForm">
        <label for="listingName">Item name</label>
        <input id="listingName" type="text" maxlength="40" placeholder="Enter item name" required>

        <label for="listingPrice">Price in Crowns</label>
        <input id="listingPrice" type="number" min="1" max="100000" placeholder="Enter price" required>

        <button type="submit">Create Listing</button>
      </form>
    </section>

    <section>
      <h2>Available Listings</h2>
      <div id="marketListings"></div>
    </section>

    <section>
      <h2>Your Inventory</h2>
      <ul id="inventoryItems"></ul>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("listingForm").addEventListener("submit", event => {
        event.preventDefault();
        window.createListing();
      });

      const inventory = document.getElementById("inventoryItems");

      function renderInventory() {
        const items = window.CrownQuest.state.inventory;
        inventory.innerHTML = "";

        if (!items.length) {
          inventory.textContent = "Your inventory is empty.";
          return;
        }

        items.forEach(item => {
          const li = document.createElement("li");
          li.textContent = `${item.name} — bought for ${item.boughtFor} Crowns`;
          inventory.appendChild(li);
        });
      }

      renderInventory();
    });
  </script>
</body>
</html>
