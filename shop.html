<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Crown Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>🛍️ Crown Quest Shop</h1>
    <div>👑 <span data-coins>500</span></div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="levels.html">Levels</a>
    <a href="shop.html">Shop</a>
    <a href="collection.html">Collection</a>
    <a href="battlepass.html">Battle Pass</a>
    <a href="market.html">Market</a>
  </nav>

  <main class="container">
    <h2>Featured Items</h2>
    <p>Spend your Crowns on rewards and new characters.</p>
    <div id="shopItems" class="shop-grid"></div>

    <section class="crate-section">
      <h2>🎁 Crate Roulette</h2>
      <p>Open a Royal Crate for a random reward!</p>
      <p>Possible rewards: Common, Rare, Epic, Legendary and Mythic.</p>
      <div id="crateResult" aria-live="polite">
        <p>Your reward will appear here.</p>
      </div>
      <button id="crateButton" type="button">Open Crate — 150 Crowns</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
